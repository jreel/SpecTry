<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecTry: Spectroscopy Practice</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="app-header">
  <div class="app-title">SpecTry <span>Spectroscopy Practice</span></div>
  <div class="header-controls">
    <div class="control-group">
      <label for="difficulty-select">Difficulty:</label>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="score-display">
      Score: <strong><span id="score-correct">0</span></strong>/<span id="score-total">0</span>
    </div>
  </div>
</header>

<main>
  <div id="spectrum-container"></div>

  <div id="loading">Loading question...</div>

  <div id="question-panel">
    <div id="hints-container" class="hints hidden">
      <span class="hints-label">Need a hint?</span>
      <div class="hints-track">
        <button id="hint-mw" class="hint-btn" data-hint="mw">Show molecular weight</button>
        <span id="hint-mw-value" class="hint-revealed hidden"></span>

        <button id="hint-formula" class="hint-btn hidden" data-hint="formula">Show molecular formula</button>
        <span id="hint-formula-value" class="hint-revealed hidden"></span>

        <button id="hint-name" class="hint-btn hidden" data-hint="name">Show compound name</button>
        <span id="hint-name-value" class="hint-revealed hidden"></span>
      </div>
    </div>

    <p id="question-text"></p>
    <div id="choices-container"></div>
    <div id="feedback-container" class="feedback hidden"></div>
    <button id="next-btn" class="hidden">Next Question &rarr;</button>
  </div>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
