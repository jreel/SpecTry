<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IR Spectrum Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafaf7;
    --accent: #6b4423;
    --accent-light: #d4c1a8;
    --error: #8b2c2c;
    --success: #2c5f3f;
    --grid: #e0ddd6;
    --peak: #2a5a8c;
    --peak-labeled: #8b2c2c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Charter, 'Bitstream Charter', 'Georgia', serif;
    background: var(--paper);
    color: var(--ink);
    padding: 2rem;
    max-width: 900px;
    margin: 0 auto;
  }

  .ir-chart {
    background: white;
    border: 1px solid var(--grid);
    border-radius: 4px;
    margin-bottom: 2rem;
  }

  .axis text {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 11px;
    fill: var(--ink);
  }

  .axis-label {
    font-family: Charter, 'Bitstream Charter', 'Georgia', serif;
    font-size: 13px;
    fill: var(--ink);
  }

  .axis path, .axis line {
    stroke: var(--ink);
    stroke-width: 1;
  }

  .grid line {
    stroke: var(--grid);
    stroke-width: 0.5;
    stroke-dasharray: 2, 4;
  }

  .grid path { stroke: none; }

  .ir-trace {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.2;
  }

  .label-marker {
    stroke: var(--peak-labeled);
    stroke-width: 1;
    stroke-dasharray: 3, 3;
  }

  .label-dot {
    fill: var(--peak-labeled);
  }

  .label-text {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 10px;
    fill: var(--peak-labeled);
    text-anchor: middle;
  }

  .label-assignment {
    font-family: Charter, 'Bitstream Charter', 'Georgia', serif;
    font-size: 10px;
    fill: var(--accent);
    text-anchor: middle;
  }

  .title-text {
    font-family: Charter, 'Bitstream Charter', 'Georgia', serif;
    font-size: 14px;
    font-weight: 600;
    fill: var(--ink);
  }

  .tooltip {
    position: absolute;
    background: white;
    border: 1px solid var(--grid);
    border-radius: 3px;
    padding: 0.35rem 0.5rem;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 11px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    z-index: 10;
  }

  .tooltip.visible { opacity: 1; }

  h2 {
    font-size: 1rem;
    margin-bottom: 0.5rem;
  }

  .demo-note {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 0.75rem;
  }
</style>
</head>
<body>

<div style="margin-bottom: 1.5rem;">
  <label for="compound-select" style="font-weight: 600; margin-right: 0.5rem;">Compound:</label>
  <select id="compound-select" style="font-family: 'SF Mono','Menlo','Consolas',monospace; font-size: 0.9rem; padding: 0.3rem 0.5rem; border: 1px solid var(--grid); border-radius: 3px;">
    <option value="ethyl_acetate">ethyl acetate</option>
    <option value="1_bromopropane">1-bromopropane</option>
    <option value="isopropanol">isopropanol</option>
    <option value="benzaldehyde">benzaldehyde</option>
  </select>
</div>

<h2>Demo 1: Full display (study/review mode)</h2>
<div class="ir-chart" id="ir-chart-full"></div>

<h2 style="margin-top: 2rem;">Demo 2: "Identify the functional group" question mode</h2>
<p class="demo-note">showName/Formula/MW: false, showSignalLabels: false</p>
<div class="ir-chart" id="ir-chart-bare"></div>

<div class="tooltip" id="tooltip"></div>

<script>
// ============================================================
// IR Spectrum Renderer
// Reads compound JSON and draws a transmittance IR spectrum.
// ============================================================

// --------------- renderIR ---------------
function renderIR(container, compound, options = {}) {
  const ir = compound.IR;
  if (!ir) return;

  const curve = ir.curve || [];
  const labels = ir.signal_labels || {};

  if (curve.length === 0) return;

  // Display options (same pattern as MS renderer)
  const show = {
    name:          options.showName !== false,
    formula:       options.showFormula !== false,
    mw:            options.showMW !== false,
    signalLabels:  options.showSignalLabels !== false,
    tooltipLabels: options.showTooltipLabels !== false,
  };

  // Normalize transmittance: detect if data is 0-100 (percent) or 0-1 (fractional)
  const maxT = d3.max(curve, d => d.transmittance);
  const tScale = maxT > 2 ? 1 : 100; // multiply fractional data by 100 to get percent

  // Dimensions
  const width = options.width || 800;
  const height = options.height || 400;
  const margin = { top: 40, right: 30, bottom: 55, left: 60 };
  const plotW = width - margin.left - margin.right;
  const plotH = height - margin.top - margin.bottom;

  // Scales: x is wavenumber HIGH to LOW (convention), y is %T 0-100
  // Fixed range matching standard IR charts
  const xMax = 4000;
  const xMin = 500;

  const x = d3.scaleLinear()
    .domain([xMax, xMin])  // reversed: high wavenumber on left
    .range([0, plotW]);

  const y = d3.scaleLinear()
    .domain([0, 100])
    .range([plotH, 0]);

  // Clear and create SVG
  d3.select(container).selectAll('*').remove();

  const svg = d3.select(container)
    .append('svg')
    .attr('width', width)
    .attr('height', height)
    .attr('viewBox', `0 0 ${width} ${height}`);

  const g = svg.append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

  // Clip path for the trace
  g.append('defs').append('clipPath')
    .attr('id', 'plot-clip-' + container.replace(/[^a-zA-Z0-9]/g, ''))
    .append('rect')
    .attr('width', plotW)
    .attr('height', plotH);

  // Background
  g.append('rect')
    .attr('width', plotW)
    .attr('height', plotH)
    .attr('fill', 'white');

  // Grid lines (horizontal)
  const yTicks = [0, 20, 40, 60, 80, 100];
  g.append('g')
    .attr('class', 'grid')
    .selectAll('line')
    .data(yTicks)
    .enter()
    .append('line')
    .attr('x1', 0)
    .attr('x2', plotW)
    .attr('y1', d => y(d))
    .attr('y2', d => y(d));

  // Axes: major ticks every 500 (labeled), minor ticks every 100 (unlabeled)
  const majorTicks = d3.range(500, 4001, 500);
  const minorTicks = d3.range(500, 4001, 100).filter(v => v % 500 !== 0);

  const xAxisMajor = d3.axisBottom(x)
    .tickSizeOuter(0)
    .tickValues(majorTicks)
    .tickSize(6);

  const xAxisMinor = d3.axisBottom(x)
    .tickSizeOuter(0)
    .tickValues(minorTicks)
    .tickSize(3)
    .tickFormat('');

  const yAxis = d3.axisLeft(y)
    .tickValues(yTicks)
    .tickSizeOuter(0);

  g.append('g')
    .attr('class', 'axis x-axis')
    .attr('transform', `translate(0,${plotH})`)
    .call(xAxisMajor);

  g.append('g')
    .attr('class', 'axis x-axis minor')
    .attr('transform', `translate(0,${plotH})`)
    .call(xAxisMinor)
    .selectAll('text').remove();

  g.append('g')
    .attr('class', 'axis y-axis')
    .call(yAxis);

  // Axis labels
  g.append('text')
    .attr('class', 'axis-label')
    .attr('x', plotW / 2)
    .attr('y', plotH + 42)
    .attr('text-anchor', 'middle')
    .text('Wavenumber (cm\u207B\u00B9)');

  g.append('text')
    .attr('class', 'axis-label')
    .attr('x', -plotH / 2)
    .attr('y', -42)
    .attr('text-anchor', 'middle')
    .attr('transform', 'rotate(-90)')
    .text('Transmittance (%)');

  // Smooth the curve to counteract quantized transmittance data.
  // Adaptive radius: target ~8 cm⁻¹ smoothing window regardless of point density.
  const avgSpacing = Math.abs(curve[0].wavenumber - curve[curve.length - 1].wavenumber) / curve.length;
  const smoothRadius = Math.max(2, Math.round(8 / avgSpacing));
  const smoothedCurve = gaussianSmooth(curve, tScale, smoothRadius);

  // Draw the IR trace
  const clipId = 'plot-clip-' + container.replace(/[^a-zA-Z0-9]/g, '');
  const line = d3.line()
    .x(d => x(d.wavenumber))
    .y(d => y(d.t))
    .curve(d3.curveMonotoneX);

  g.append('path')
    .datum(smoothedCurve)
    .attr('class', 'ir-trace')
    .attr('clip-path', `url(#${clipId})`)
    .attr('d', line);

  // Signal labels: drop lines from top of plot to the absorption
  if (show.signalLabels && Object.keys(labels).length > 0) {
    // Use smoothed data for label placement
    const sortedSmoothed = [...smoothedCurve].sort((a, b) => a.wavenumber - b.wavenumber);

    const labelEntries = Object.entries(labels).map(([key, info]) => {
      const wn = info.wavenumber;
      const tVal = interpolateSmoothed(sortedSmoothed, wn);
      return { key, wn, tVal, assignment: info.assignment, intensity: info.intensity };
    });

    // Sort labels by wavenumber (high to low, matching visual left to right)
    labelEntries.sort((a, b) => b.wn - a.wn);

    // Label positioning: collect, resolve collisions, then draw
    const pendingLabels = labelEntries.map(entry => ({
      ...entry,
      xPx: x(entry.wn),
      // Label sits near top of plot; stagger if needed
      labelY: 15,
    }));

    // Collision resolution on label x positions (same approach as MS)
    pendingLabels.sort((a, b) => a.xPx - b.xPx);
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 1; i < pendingLabels.length; i++) {
        const prev = pendingLabels[i - 1];
        const curr = pendingLabels[i];
        const minGap = 28; // minimum px between label centers
        const overlap = minGap - (curr.xPx - prev.xPx);
        if (overlap > 0) {
          const nudge = Math.ceil(overlap / 2);
          prev.xPx -= nudge;
          curr.xPx += nudge;
        }
      }
    }

    // Draw labels
    const labelGroup = g.append('g').attr('class', 'ir-labels');

    pendingLabels.forEach(lbl => {
      const peakX = x(lbl.wn);
      const peakY = y(lbl.tVal);

      // Dashed drop line from label to the absorption point
      labelGroup.append('line')
        .attr('class', 'label-marker')
        .attr('x1', lbl.xPx)
        .attr('y1', lbl.labelY + 8)
        .attr('x2', peakX)
        .attr('y2', peakY - 4);

      // Small dot at the absorption
      labelGroup.append('circle')
        .attr('class', 'label-dot')
        .attr('cx', peakX)
        .attr('cy', peakY)
        .attr('r', 2.5);

      // Wavenumber text
      labelGroup.append('text')
        .attr('class', 'label-text')
        .attr('x', lbl.xPx)
        .attr('y', lbl.labelY)
        .text(lbl.wn);
    });
  }

  // Title
  let title = 'IR Spectrum';
  if (show.name) title += ': ' + compound.name;
  const meta = [];
  if (show.formula && compound.formula) meta.push(compound.formula);
  if (show.mw && compound.molecular_weight) meta.push('MW ' + compound.molecular_weight);
  if (meta.length) title += ' (' + meta.join(', ') + ')';

  svg.append('text')
    .attr('class', 'title-text')
    .attr('x', margin.left)
    .attr('y', 24)
    .text(title);

  // Crosshair tooltip: track mouse position on curve
  const tooltip = document.getElementById('tooltip');

  // Invisible overlay for mouse tracking
  const overlay = g.append('rect')
    .attr('width', plotW)
    .attr('height', plotH)
    .attr('fill', 'transparent')
    .attr('cursor', 'crosshair');

  // Crosshair lines
  const crosshairV = g.append('line')
    .attr('stroke', '#999')
    .attr('stroke-width', 0.5)
    .attr('stroke-dasharray', '4,3')
    .style('display', 'none');

  const crosshairH = g.append('line')
    .attr('stroke', '#999')
    .attr('stroke-width', 0.5)
    .attr('stroke-dasharray', '4,3')
    .style('display', 'none');

  // Bisector for finding closest curve point
  const sortedSmoothedForTooltip = [...smoothedCurve].sort((a, b) => a.wavenumber - b.wavenumber);

  overlay
    .on('mouseenter', () => {
      crosshairV.style('display', null);
      crosshairH.style('display', null);
    })
    .on('mousemove', function(event) {
      const [mx, my] = d3.pointer(event);
      const wn = x.invert(mx);
      const tVal = interpolateSmoothed(sortedSmoothedForTooltip, wn);

      if (tVal === null) return;

      const curveY = y(tVal);

      crosshairV.attr('x1', mx).attr('x2', mx).attr('y1', 0).attr('y2', plotH);
      crosshairH.attr('x1', 0).attr('x2', plotW).attr('y1', curveY).attr('y2', curveY);

      let html = `<strong>${Math.round(wn)} cm\u207B\u00B9</strong><br>${tVal.toFixed(1)}% T`;

      // Check if near a labeled peak
      if (show.tooltipLabels) {
        for (const [key, info] of Object.entries(labels)) {
          if (Math.abs(info.wavenumber - wn) < 15) {
            html += `<br><em>${info.assignment}</em>`;
            break;
          }
        }
      }

      tooltip.innerHTML = html;
      tooltip.classList.add('visible');
      tooltip.style.left = (event.pageX + 12) + 'px';
      tooltip.style.top = (event.pageY - 10) + 'px';
    })
    .on('mouseleave', () => {
      crosshairV.style('display', 'none');
      crosshairH.style('display', 'none');
      tooltip.classList.remove('visible');
    });
}

// Gaussian smoothing for quantized IR transmittance data.
// radius = number of neighboring points on each side to include.
// Returns array of {wavenumber, t} where t is smoothed %T.
function gaussianSmooth(curve, tScale, radius) {
  const n = curve.length;
  const sigma = radius / 2;
  const kernel = [];
  let kernelSum = 0;
  for (let i = -radius; i <= radius; i++) {
    const w = Math.exp(-(i * i) / (2 * sigma * sigma));
    kernel.push(w);
    kernelSum += w;
  }
  // Normalize kernel
  for (let i = 0; i < kernel.length; i++) kernel[i] /= kernelSum;

  const result = [];
  for (let i = 0; i < n; i++) {
    let smoothedT = 0;
    for (let k = -radius; k <= radius; k++) {
      const j = Math.max(0, Math.min(n - 1, i + k));
      smoothedT += curve[j].transmittance * tScale * kernel[k + radius];
    }
    result.push({ wavenumber: curve[i].wavenumber, t: smoothedT });
  }
  return result;
}

// Interpolate smoothed transmittance at a given wavenumber
function interpolateSmoothed(sortedSmoothed, wn) {
  const bisect = d3.bisector(d => d.wavenumber).left;
  const idx = bisect(sortedSmoothed, wn);
  if (idx <= 0) return sortedSmoothed[0].t;
  if (idx >= sortedSmoothed.length) return sortedSmoothed[sortedSmoothed.length - 1].t;
  const a = sortedSmoothed[idx - 1];
  const b = sortedSmoothed[idx];
  const frac = (wn - a.wavenumber) / (b.wavenumber - a.wavenumber);
  return a.t + frac * (b.t - a.t);
}

// --------------- Load and render ---------------
async function loadCompound(id) {
  try {
    const resp = await fetch(`../data/${id}.json`);
    if (!resp.ok) throw new Error(resp.statusText);
    const data = await resp.json();

    if (!data.IR || !data.IR.curve || data.IR.curve.length === 0) {
      document.getElementById('ir-chart-full').innerHTML =
        '<p style="color:var(--error);padding:1rem;">No IR curve data for this compound.</p>';
      document.getElementById('ir-chart-bare').innerHTML = '';
      return;
    }

    renderIR('#ir-chart-full', data);

    renderIR('#ir-chart-bare', data, {
      showName: false,
      showFormula: false,
      showMW: false,
      showSignalLabels: false,
      showTooltipLabels: false,
    });
  } catch(e) {
    document.getElementById('ir-chart-full').innerHTML =
      `<p style="color:var(--error);padding:1rem;">Could not load ${id}.json: ${e.message}</p>`;
    document.getElementById('ir-chart-bare').innerHTML = '';
  }
}

const select = document.getElementById('compound-select');
select.addEventListener('change', () => loadCompound(select.value));

// Embed mode: when loaded in an iframe with ?embed, hide the UI chrome
// and listen for compound data via postMessage
const params = new URLSearchParams(window.location.search);
const isEmbed = params.has('embed');

if (isEmbed) {
  // Hide dropdown, demo labels, and second chart
  document.querySelectorAll('h2, .demo-note, #compound-select')
    .forEach(el => el.style.display = 'none');
  document.querySelector('label[for="compound-select"]').style.display = 'none';
  document.getElementById('ir-chart-bare').style.display = 'none';
  document.body.style.padding = '0.5rem';

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (msg && msg.type === 'render-ir' && msg.compound) {
      const data = msg.compound;
      if (!data.IR || !data.IR.curve || data.IR.curve.length === 0) {
        document.getElementById('ir-chart-full').innerHTML =
          '<p style="color:var(--error);padding:0.5rem;">No IR curve data.</p>';
        return;
      }
      renderIR('#ir-chart-full', data);
    }
  });
} else {
  // Normal standalone mode: load from file
  loadCompound(select.value);
}
</script>
</body>
</html>
